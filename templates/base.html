<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ home_url }}">
  <meta property="og:image" content="/static/img/shoter.webp">
  <meta property="og:site_name" content="ZEZH.RU">
  <link
    rel="icon"
    type="image/x-icon"
    id="zezh-favicon"
    href="/static/cr_logo/favicon/favicon-white.ico"
    data-active="/static/cr_logo/favicon/favicon-white.ico"
    data-hidden="/static/cr_logo/favicon/favicon-black.ico"
  >
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/main.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="ZEZH.RU">
        <picture class="brand-mark">
          <source srcset="/static/cr_logo/svg/cr_logo_white.svg" media="(prefers-color-scheme: dark)">
          <img src="/static/cr_logo/svg/cr_logo_black.svg" alt="">
        </picture>
        <span class="brand-copy">
          <strong>ZEZH.RU</strong>
          <span>короткие ссылки</span>
        </span>
      </a>

      <nav class="primary-nav" aria-label="Основная навигация">
        <a class="nav-link{% if request.path == '/' %} is-active{% endif %}" href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>
          Одна ссылка
        </a>
        <a class="nav-link{% if request.path == '/create_multi' %} is-active{% endif %}" href="/create_multi" {% if request.path == '/create_multi' %}aria-current="page"{% endif %}>
          Мульти-ссылка
        </a>
      </nav>
    </header>

    <main class="page-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <a class="footer-brand" href="https://r.zezh.ru/" target="_blank" rel="noopener noreferrer">
          <picture>
            <source srcset="/static/full_logo/svg/full_logo_white.svg" media="(prefers-color-scheme: dark)">
            <img src="/static/full_logo/svg/full_logo_black.svg" alt="ZEZH.RU" width="104">
          </picture>
          <span class="footer-brand__text">
            <span class="footer-brand__arrow" aria-hidden="true">←</span>
            Больше о разработчике
          </span>
        </a>
        <div class="div">
          <a class="source-link" href="https://github.com/Dazezh/zezh.ru" target="_blank" rel="noopener noreferrer"><span>исходный код на GitHub</span></a>
          <p>© 2026 Роман Бальчонок. Все права защищены.</p>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
